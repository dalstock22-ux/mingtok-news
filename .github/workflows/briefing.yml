name: 뉴스 브리핑 갱신
on:
  schedule:
    - cron: "30 0 * * *"   # 한국시간 오전 9:30
    - cron: "0 9 * * *"    # 한국시간 오후 6:00
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python make_briefing.py briefing.json
      - name: 변경 시 커밋
        run: |
          git config user.name "mingtok-news-bot"
          git config user.email "actions@users.noreply.github.com"
          git add briefing.json
          git diff --cached --quiet || (git commit -m "뉴스 브리핑 갱신" && git push)
